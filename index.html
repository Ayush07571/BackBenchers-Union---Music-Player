<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>After Hours — Your Late-Night Playlist</title>
<meta name="description" content="After Hours — a place for good music, late nights, quiet moments, and whatever you feel like listening to.">
<meta property="og:title" content="After Hours">
<meta property="og:description" content="A late-night playlist for whatever mood finds you.">
<meta property="og:type" content="website">
<meta property="og:image" content="backdrop.png">
<meta property="og:image:alt" content="After Hours — a late-night music space">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="After Hours">
<meta name="twitter:description" content="A late-night playlist for whatever mood finds you.">
<meta name="twitter:image" content="backdrop.png">
<meta name="theme-color" content="#0b0f16">

<!-- Minimal moon + headphones favicon / site logo -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f16'/%3E%3Ccircle cx='29' cy='27' r='16' fill='%23ffcf7a'/%3E%3Ccircle cx='37' cy='21' r='16' fill='%230b0f16'/%3E%3Cpath d='M39 35v16c0 4-3 7-7 7-3 0-6-2-6-5s3-5 6-5c2 0 4 1 5 2V27l15-4v14c0 4-3 7-7 7-3 0-6-2-6-5s3-5 6-5c2 0 4 1 5 2v-8z' fill='%23f1ecdf'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f16'/%3E%3Ccircle cx='38' cy='25' r='14' fill='%23ffcf7a'/%3E%3Ccircle cx='44' cy='20' r='14' fill='%230b0f16'/%3E%3Cpath d='M17 38a15 15 0 0 1 30 0v8a5 5 0 0 1-10 0v-7a5 5 0 0 1 10 0' fill='none' stroke='%23f1ecdf' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Yatra+One&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#e8a556;
    --amber-soft:#ffcf7a;
    --ink:#0b0f16;
    --text:#f1ecdf;
    --muted:#9aa3b5;
    --glass:rgba(10,14,20,0.55);
    --glass-border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; font-family:'Inter',sans-serif; }
  body{
    background:var(--ink);
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    background-image:url('backdrop.png');
    background-size:cover;
    background-position:center center;
  }
  .stage::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,7,12,0.55) 0%, rgba(5,7,12,0.05) 22%, rgba(5,7,12,0.05) 60%, rgba(5,7,12,0.75) 100%);
    pointer-events:none;
  }

  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 26px;
    z-index:5;
  }
  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    letter-spacing:0.04em;
    color:var(--text);
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .online{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .online .dot{
    width:6px; height:6px; border-radius:50%;
    background:#5fd97a;
    box-shadow:0 0 6px #5fd97a;
  }
  .links{ display:flex; gap:16px; }
  .links a{
    display:flex; align-items:center; gap:6px;
    font-size:12px;
    color:var(--muted);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
    opacity:0.85;
    transition:opacity .2s;
  }
  .links a:hover{ opacity:1; color:var(--amber-soft); }

  .brand-mark{
    width:28px;
    height:28px;
    margin:0 auto 10px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,207,122,0.35);
    border-radius:50%;
    color:var(--amber-soft);
    font-size:16px;
    background:rgba(11,15,22,0.28);
    box-shadow:0 0 24px rgba(232,165,86,0.12);
  }

  .title-wrap{
    position:absolute;
    top:14%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:5;
    width:90%;
    max-width:640px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:lowercase;
    color:var(--amber-soft);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(44px, 8.5vw, 84px);
    line-height:1.08;
    color:var(--text);
    text-shadow:0 6px 30px rgba(0,0,0,0.7);
  }
  .sub{
    margin-top:14px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(14px, 1.8vw, 18px);
    color:var(--text);
    opacity:0.85;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
  .sub em{
    font-style:italic;
    font-weight:500;
    color:var(--amber-soft);
  }

  .player{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px 12px 12px;
    border-radius:100px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    min-width:340px;
  }
  .thumb{
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--amber-soft), var(--amber) 60%, #7a5326 100%);
    flex-shrink:0;
    position:relative;
    animation:spin 8s linear infinite paused;
  }
  .thumb.spinning{ animation-play-state:running; }
  .thumb::after{
    content:'';
    position:absolute; inset:16px;
    border-radius:50%;
    background:var(--ink);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .meta{ min-width:150px; }
  .track-title{
    font-size:13px; font-weight:600;
    color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:180px;
  }
  .track-artist{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:180px;
  }
  .progress-row{
    display:flex; align-items:center; gap:8px;
    margin-top:6px;
  }
  .bar{
    width:150px; height:3px;
    background:rgba(255,255,255,0.15);
    border-radius:2px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%; width:0%;
    background:var(--amber-soft);
    transition:width .3s linear;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
  }

  .controls{
    display:flex; align-items:center; gap:14px;
    padding-left:6px;
    border-left:1px solid var(--glass-border);
  }
  .ctrl-btn{
    background:none; border:none; cursor:pointer;
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    transition:color .2s, transform .15s;
  }
  .ctrl-btn:hover{ color:var(--text); }
  .ctrl-btn:active{ transform:scale(0.9); }
  .play-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--amber-soft);
    color:var(--ink);
  }
  .play-btn:hover{ color:var(--ink); background:#fff0c9; }

  @media (max-width:560px){
    .player{ min-width:auto; width:88%; padding:10px 14px 10px 10px; gap:10px; }
    .bar{ width:90px; }
    .meta{ min-width:100px; }
    .track-title, .track-artist{ max-width:110px; }
    .title-wrap{ top:12%; }
    h1{ font-size:20px; }
    .links{ gap:10px; }\n    .links a span.label{ display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <div>
      <div class="clock" id="clockText">--:--</div>
      <div class="online" id="onlineWrap"><span class="dot"></span><span id="onlineCount">0</span> online</div>
    </div>
    <div class="links" id="linksWrap">
      <a href="#" id="spotifyLink" target="_blank" rel="noopener" style="display:none;">♫ <span class="label">Spotify</span> ↗</a>
      <a href="#" id="youtubeLink" target="_blank" rel="noopener" style="display:none;">▶ <span class="label">YouTube</span> ↗</a>
      <a href="#" id="ytMusicLink" target="_blank" rel="noopener" style="display:none;">▷ <span class="label">YouTube Music</span> ↗</a>
    </div>
  </div>  <div class="title-wrap">
    <div class="eyebrow">late night / now playing</div>
    <div class="brand-mark" aria-hidden="true">♫</div>
    <h1>After <em>Hours</em></h1>
    <p class="sub">good music, quiet nights, <em>whatever comes next.</em></p>
  </div>

  <div class="player">
    <div class="thumb" id="thumb"></div>
    <div class="meta">
      <div class="track-title" id="trackTitle">tap play to listen</div>
      <div class="track-artist" id="trackArtist">your playlist</div>
      <div class="progress-row">
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="time" id="timeText">0:00 / 0:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="previous">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" title="play">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="next">⏭</button>
    </div>
  </div>
</div>

<div id="ytPlayer" style="position:fixed; width:2px; height:2px; left:-10px; bottom:-10px; opacity:0; pointer-events:none;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // 👉 Add your external playlist links here.
  // YouTube is automatically connected to the same playlist used by the player below.
  const SPOTIFY_PLAYLIST_URL = ""; // e.g. "https://open.spotify.com/playlist/..."
  const YT_MUSIC_URL = "";         // optional: "https://music.youtube.com/playlist?list=..."

  const spotifyLink = document.getElementById('spotifyLink');
  const youtubeLink = document.getElementById('youtubeLink');
  const ytMusicLink = document.getElementById('ytMusicLink');

  if(SPOTIFY_PLAYLIST_URL){
    spotifyLink.href = SPOTIFY_PLAYLIST_URL;
    spotifyLink.style.display = 'flex';
  }
  if(YT_MUSIC_URL){
    ytMusicLink.href = YT_MUSIC_URL;
    ytMusicLink.style.display = 'flex';
  }

  function tick(){
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h===0) h = 12;
    document.getElementById('clockText').textContent =
      String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  tick(); setInterval(tick, 1000*15);

  const onlineEl = document.getElementById('onlineCount');
  const onlineWrap = document.getElementById('onlineWrap');

  // 👉 REAL online count via Firebase Realtime Database presence.
  // Setup (free, ~5 min): see instructions below the code block in chat.
  // Paste your config here. Leave FIREBASE_CONFIG as null to hide this
  // element entirely instead of showing a fake number.
  const FIREBASE_CONFIG = null;
  /* Example:
  const FIREBASE_CONFIG = {
    apiKey: "AIza...",
    databaseURL: "https://your-project-id-default-rtdb.firebaseio.com",
    projectId: "your-project-id"
  };
  */

  if(FIREBASE_CONFIG){
    const fbScript1 = document.createElement('script');
    fbScript1.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
    fbScript1.onload = () => {
      const fbScript2 = document.createElement('script');
      fbScript2.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js";
      fbScript2.onload = () => {
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();
        const myRef = db.ref('presence').push();
        db.ref('.info/connected').on('value', (snap) => {
          if(snap.val() === true){
            myRef.onDisconnect().remove();
            myRef.set(true);
          }
        });
        db.ref('presence').on('value', (snap) => {
          onlineEl.textContent = snap.numChildren();
        });
      };
      document.head.appendChild(fbScript2);
    };
    document.head.appendChild(fbScript1);
  } else {
    onlineWrap.style.display = 'none';
  }

  // 👉 Replace with your YouTube playlist ID.
  // Find it in: youtube.com/playlist?list=THIS_PART
  const YT_PLAYLIST_ID = "PL7B34S0Z1qGxE8spoH0xitKG-3jLI5CyZ";

  // "Listen on YouTube" always points to the exact playlist powering the player.
  if(YT_PLAYLIST_ID){
    const youtubePlaylistUrl = "https://www.youtube.com/playlist?list=" + YT_PLAYLIST_ID;
    youtubeLink.href = youtubePlaylistUrl;
    youtubeLink.style.display = 'flex';
  }

  let ytPlayer, ytReady = false, isPlaying = false, progressTimer;
  const playBtn = document.getElementById('playBtn');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const barFill = document.getElementById('barFill');
  const timeText = document.getElementById('timeText');
  const thumb = document.getElementById('thumb');

  function fmt(s){
    s = Math.floor(s || 0);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  let inMixFallback = false;
  let pinnedSeedId = null;
  const playedVideoIds = new Set();

  // 👉 Optional: force the mix to always seed from one specific song,
  // regardless of what's first in your playlist. Paste a YouTube video ID
  // (the part after "v=" in a normal youtube.com/watch?v=... URL).
  // Leave empty to auto-use the first track in your playlist instead.
  const PINNED_SEED_VIDEO_ID = "";

  function onYouTubeIframeAPIReady(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1',
      playerVars: { listType: 'playlist', list: YT_PLAYLIST_ID, autoplay: 0, playsinline: 1, rel: 0, origin: window.location.origin },
      events: {
        onReady: () => {
          ytReady = true;
          const originalList = ytPlayer.getPlaylist();
          pinnedSeedId = PINNED_SEED_VIDEO_ID || (originalList && originalList[0]) || null;
          ytPlayer.setShuffle(true);
        },
        onError: (e) => {
          const messages = {
            2: 'Invalid YouTube video or playlist.',
            5: 'YouTube playback is not supported by this player.',
            100: 'This song is unavailable or has been removed.',
            101: 'This song does not allow playback on this website.',
            150: 'This song does not allow playback on this website.'
          };
          trackTitle.textContent = messages[e.data] || 'YouTube playback error';
          trackArtist.textContent = 'Try opening the playlist on YouTube ↗';
          playBtn.textContent = '▶';
          isPlaying = false;
          thumb.classList.remove('spinning');
        },
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.ENDED && !inMixFallback && false){
            const list = ytPlayer.getPlaylist();
            const allPlayed = list && playedVideoIds.size >= list.length;
            if(allPlayed && pinnedSeedId){
              // playlist is over — hand off into a YouTube Mix seeded from
              // a fixed track of yours, not whatever happened to play last
              inMixFallback = true;
              ytPlayer.loadPlaylist({ list: 'RD' + pinnedSeedId, listType: 'playlist', index: 0 });
              ytPlayer.setShuffle(true);
            }
          }
          if(e.data === YT.PlayerState.PLAYING){
            isPlaying = true;
            playBtn.textContent = '❚❚';
            thumb.classList.add('spinning');
            const data = ytPlayer.getVideoData();
            playedVideoIds.add(data.video_id);
            trackTitle.textContent = data.title || 'now playing';
            trackArtist.textContent = (data.author || 'after hours') + (inMixFallback ? ' · mix' : '');
            clearInterval(progressTimer);
            progressTimer = setInterval(updateProgress, 500);
          } else if(e.data === YT.PlayerState.PAUSED){
            isPlaying = false;
            playBtn.textContent = '▶';
            thumb.classList.remove('spinning');
            clearInterval(progressTimer);
          }
        }
      }
    });
  }

  function updateProgress(){
    if(!ytReady) return;
    const dur = ytPlayer.getDuration();
    const cur = ytPlayer.getCurrentTime();
    if(dur > 0){
      barFill.style.width = (cur/dur*100) + '%';
      timeText.textContent = fmt(cur) + ' / ' + fmt(dur);
    }
  }

  playBtn.addEventListener('click', () => {
    if(!ytReady) return;
    if(isPlaying){
      ytPlayer.pauseVideo();
    } else {
      // User gesture starts YouTube playback.
      ytPlayer.playVideo();
    }
  });
  document.getElementById('nextBtn').addEventListener('click', () => { if(ytReady) ytPlayer.nextVideo(); });
  document.getElementById('prevBtn').addEventListener('click', () => { if(ytReady) ytPlayer.previousVideo(); });
</script>

</body>
</html>

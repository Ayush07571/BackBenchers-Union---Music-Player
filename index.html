<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>After Hours — Your Late-Night Playlist</title>
<meta name="description" content="After Hours — a place for good music, late nights, quiet moments, and whatever you feel like listening to.">
<meta property="og:title" content="After Hours">
<meta property="og:description" content="A late-night playlist for whatever mood finds you.">
<meta property="og:type" content="website">
<meta property="og:image" content="backdrop.png">
<meta property="og:image:alt" content="After Hours — a late-night music space">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="After Hours">
<meta name="twitter:description" content="A late-night playlist for whatever mood finds you.">
<meta name="twitter:image" content="backdrop.png">
<meta name="theme-color" content="#0b0f16">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f16'/%3E%3Ccircle cx='29' cy='27' r='16' fill='%23ffcf7a'/%3E%3Ccircle cx='37' cy='21' r='16' fill='%230b0f16'/%3E%3Cpath d='M39 35v16c0 4-3 7-7 7-3 0-6-2-6-5s3-5 6-5c2 0 4 1 5 2V27l15-4v14c0 4-3 7-7 7-3 0-6-2-6-5s3-5 6-5c2 0 4 1 5 2v-8z' fill='%23f1ecdf'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f16'/%3E%3Ccircle cx='38' cy='25' r='14' fill='%23ffcf7a'/%3E%3Ccircle cx='44' cy='20' r='14' fill='%230b0f16'/%3E%3Cpath d='M17 38a15 15 0 0 1 30 0v8a5 5 0 0 1-10 0v-7a5 5 0 0 1 10 0' fill='none' stroke='%23f1ecdf' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Yatra+One&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#e8a556;
    --amber-soft:#ffcf7a;
    --ink:#0b0f16;
    --text:#f1ecdf;
    --muted:#9aa3b5;
    --glass:rgba(10,14,20,0.55);
    --glass-border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; font-family:'Inter',sans-serif; }
  body{
    background:var(--ink);
    color:var(--text);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    background-image:url('backdrop.png');
    background-size:cover;
    background-position:center center;
  }
  /* 👉 Optional: give mobile its own crop/composition so the subject
     doesn't get lost in a wide desktop image squeezed into portrait.
     Just drop a backdrop-mobile.png into the same folder — this rule
     already points at it. If the file doesn't exist, browsers silently
     keep using backdrop.png above, so nothing breaks either way. */
  @media (max-width:700px), (orientation:portrait){
    .stage{
      background-image:url('backdrop-mobile.png'), url('backdrop.png');
      background-position:center 22%;
    }
  }
  .stage::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,7,12,0.55) 0%, rgba(5,7,12,0.05) 22%, rgba(5,7,12,0.05) 60%, rgba(5,7,12,0.75) 100%);
    pointer-events:none;
  }

  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 26px;
    padding-top:calc(22px + env(safe-area-inset-top));
    z-index:5;
    gap:10px;
  }
  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    letter-spacing:0.04em;
    color:var(--text);
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .online{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .online .dot{
    width:6px; height:6px; border-radius:50%;
    background:#5fd97a;
    box-shadow:0 0 6px #5fd97a;
  }
  .links{ display:flex; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
  .links a{
    display:flex; align-items:center; gap:6px;
    font-size:12px;
    color:var(--muted);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
    opacity:0.85;
    transition:opacity .2s;
    white-space:nowrap;
  }
  .links a:hover{ opacity:1; color:var(--amber-soft); }

  .brand-mark{
    width:28px;
    height:28px;
    margin:0 auto 10px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,207,122,0.35);
    border-radius:50%;
    color:var(--amber-soft);
    font-size:16px;
    background:rgba(11,15,22,0.28);
    box-shadow:0 0 24px rgba(232,165,86,0.12);
  }

  .title-wrap{
    position:absolute;
    top:14%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:5;
    width:90%;
    max-width:640px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:lowercase;
    color:var(--amber-soft);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(34px, 8.5vw, 84px);
    line-height:1.08;
    color:var(--text);
    text-shadow:0 6px 30px rgba(0,0,0,0.7);
  }
  .sub{
    margin-top:14px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(13px, 1.8vw, 18px);
    color:var(--text);
    opacity:0.85;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
  .sub em{
    font-style:italic;
    font-weight:500;
    color:var(--amber-soft);
  }

  .player{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px 12px 12px;
    border-radius:100px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    min-width:340px;
    max-width:92vw;
    bottom:calc(34px + env(safe-area-inset-bottom));
  }
  .thumb{
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--amber-soft), var(--amber) 60%, #7a5326 100%);
    flex-shrink:0;
    position:relative;
    animation:spin 8s linear infinite paused;
  }
  .thumb.spinning{ animation-play-state:running; }
  .thumb::after{
    content:'';
    position:absolute; inset:16px;
    border-radius:50%;
    background:var(--ink);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .meta{ min-width:150px; overflow:hidden; }
  .track-title{
    font-size:13px; font-weight:600;
    color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:180px;
  }
  .track-artist{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:180px;
  }
  .progress-row{
    display:flex; align-items:center; gap:8px;
    margin-top:6px;
  }
  .bar{
    width:150px; height:3px;
    background:rgba(255,255,255,0.15);
    border-radius:2px;
    overflow:hidden;
    flex-shrink:1;
  }
  .bar-fill{
    height:100%; width:0%;
    background:var(--amber-soft);
    transition:width .3s linear;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
  }

  .controls{
    display:flex; align-items:center; gap:12px;
    padding-left:6px;
    border-left:1px solid var(--glass-border);
    flex-shrink:0;
  }
  .ctrl-btn{
    background:none; border:none; cursor:pointer;
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    transition:color .2s, transform .15s;
  }
  .ctrl-btn:hover{ color:var(--text); }
  .ctrl-btn:active{ transform:scale(0.9); }
  .play-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--amber-soft);
    color:var(--ink);
    flex-shrink:0;
  }
  .play-btn:hover{ color:var(--ink); background:#fff0c9; }

  .rain-toggle{
    position:absolute;
    z-index:6;
    right:26px;
    bottom:calc(120px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-radius:100px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    transition:color .2s, border-color .2s;
    user-select:none;
  }
  .rain-toggle.active{
    color:var(--amber-soft);
    border-color:rgba(255,207,122,0.35);
  }
  .rain-icon{ font-size:13px; }

  .mixer{
    position:absolute;
    z-index:6;
    right:26px;
    bottom:calc(68px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 13px;
    border-radius:100px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .mixer-control{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:12px;
  }
  .mixer-control input{
    width:82px;
    height:14px;
    accent-color:var(--amber-soft);
    cursor:pointer;
  }

  .debug-panel{
    position:absolute;
    z-index:9;
    top:calc(70px + env(safe-area-inset-top));
    left:16px;
    max-width:280px;
    max-height:40vh;
    overflow-y:auto;
    background:rgba(10,10,14,0.85);
    border:1px solid rgba(255,120,100,0.3);
    border-radius:10px;
    padding:10px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:#ffcdc0;
    display:none;
  }
  .debug-panel.show{ display:block; }
  .debug-panel h4{ font-size:10px; color:#ff9d85; margin-bottom:6px; letter-spacing:.05em; }
  .debug-panel div{ padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.06); word-break:break-word; }

  @media (max-width:560px){
    .topbar{ padding:16px 16px; padding-top:calc(16px + env(safe-area-inset-top)); }
    .clock{ font-size:12px; }
    .online{ font-size:10px; }
    .links{ gap:10px; }
    .links a span.label{ display:none; }
    .links a{ font-size:11px; }

    .title-wrap{ top:11%; width:94%; }
    .sub{ margin-top:10px; }

    .player{
      min-width:auto;
      width:94vw;
      max-width:94vw;
      padding:10px 12px 10px 10px;
      gap:10px;
      bottom:calc(18px + env(safe-area-inset-bottom));
    }
    .thumb{ width:38px; height:38px; }
    .meta{ min-width:0; flex:1; }
    .track-title, .track-artist{ max-width:100%; }
    .seek-bar{ width:auto; flex:1; min-width:50px; }
    .controls{ gap:8px; padding-left:8px; }
    .play-btn{ width:34px; height:34px; }

    .rain-toggle{
      right:50%;
      transform:translateX(50%);
      bottom:calc(122px + env(safe-area-inset-bottom));
    }
    .mixer{
      right:50%;
      transform:translateX(50%);
      bottom:calc(78px + env(safe-area-inset-bottom));
      gap:9px;
      padding:7px 10px;
    }
    .mixer-control input{ width:70px; }
  }

  @media (max-width:380px){
    h1{ font-size:26px; }
    .meta{ display:none; }
    .player{ justify-content:center; gap:14px; }
    .controls{ border-left:none; padding-left:0; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <div>
      <div class="clock" id="clockText">--:--</div>
      <div class="online" id="onlineWrap"><span class="dot"></span><span id="onlineCount">0</span> online</div>
    </div>
    <div class="links" id="linksWrap">
      <a href="#" id="spotifyLink" target="_blank" rel="noopener" style="display:none;">♫ <span class="label">Spotify</span> ↗</a>
      <a href="#" id="youtubeLink" target="_blank" rel="noopener" style="display:none;">▶ <span class="label">YouTube</span> ↗</a>
      <a href="#" id="ytMusicLink" target="_blank" rel="noopener" style="display:none;">▷ <span class="label">YouTube Music</span> ↗</a>
    </div>
  </div>

  <div class="title-wrap">
    <div class="eyebrow">late night / now playing</div>
    <div class="brand-mark" aria-hidden="true">♫</div>
    <h1>After <em>Hours</em></h1>
    <p class="sub">good music, quiet nights, <em>whatever comes next.</em></p>
  </div>

  <div class="debug-panel" id="debugPanel">
    <h4>skipped songs (admin only)</h4>
    <div id="debugList">none yet</div>
  </div>

  <button class="rain-toggle" id="rainToggle" title="toggle rain sound">
    <span class="rain-icon">🌧</span><span id="rainLabel">rain: off</span>
  </button>

  <div class="player">
    <div class="thumb" id="thumb"></div>
    <div class="meta">
      <div class="track-title" id="trackTitle">tap play to listen</div>
      <div class="track-artist" id="trackArtist">your playlist</div>
      <div class="progress-row">
        <input class="seek-bar" id="seekBar" type="range" min="0" max="1000" value="0" step="1"
               aria-label="Song progress" title="Click or drag to seek">
        <div class="time" id="timeText">0:00 / 0:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="back10Btn" title="back 10 seconds" aria-label="Back 10 seconds">↶10</button>
      <button class="ctrl-btn" id="prevBtn" title="previous">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" title="play">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="next">⏭</button>
      <button class="ctrl-btn" id="forward10Btn" title="forward 10 seconds" aria-label="Forward 10 seconds">10↷</button>
    </div>
  </div>

  <div class="mixer" id="mixer">
    <label class="mixer-control" title="Song volume">
      <span>♫</span>
      <input id="songVolume" type="range" min="0" max="100" value="100" step="1" aria-label="Song volume">
    </label>
    <label class="mixer-control" title="Rain volume">
      <span>🌧</span>
      <input id="rainVolume" type="range" min="0" max="100" value="35" step="1" aria-label="Rain volume">
    </label>
  </div>
</div>

<div id="ytPlayer" style="position:fixed; width:2px; height:2px; left:-10px; bottom:-10px; opacity:0; pointer-events:none;"></div>

<!-- Rain ambience track. Loops seamlessly while toggled on. -->
<audio id="rainAudio" src="rain.mp3" loop preload="auto"></audio>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // ---------- external links ----------
  const SPOTIFY_PLAYLIST_URL = "";
  const YT_MUSIC_URL = "";

  const spotifyLink = document.getElementById('spotifyLink');
  const youtubeLink = document.getElementById('youtubeLink');
  const ytMusicLink = document.getElementById('ytMusicLink');

  if(SPOTIFY_PLAYLIST_URL){ spotifyLink.href = SPOTIFY_PLAYLIST_URL; spotifyLink.style.display = 'flex'; }
  if(YT_MUSIC_URL){ ytMusicLink.href = YT_MUSIC_URL; ytMusicLink.style.display = 'flex'; }

  // ---------- clock ----------
  function tick(){
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h===0) h = 12;
    document.getElementById('clockText').textContent =
      String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  tick(); setInterval(tick, 1000*15);

  // ---------- online presence (real, via Firebase) ----------
  const onlineEl = document.getElementById('onlineCount');
  const onlineWrap = document.getElementById('onlineWrap');
  const FIREBASE_CONFIG = null;
  if(FIREBASE_CONFIG){
    const fbScript1 = document.createElement('script');
    fbScript1.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
    fbScript1.onload = () => {
      const fbScript2 = document.createElement('script');
      fbScript2.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js";
      fbScript2.onload = () => {
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();
        const myRef = db.ref('presence').push();
        db.ref('.info/connected').on('value', (snap) => {
          if(snap.val() === true){
            myRef.onDisconnect().remove();
            myRef.set(true);
          }
        });
        db.ref('presence').on('value', (snap) => {
          onlineEl.textContent = snap.numChildren();
        });
      };
      document.head.appendChild(fbScript2);
    };
    document.head.appendChild(fbScript1);
  } else {
    onlineWrap.style.display = 'none';
  }

  // ---------- admin-only debug logging for skipped songs ----------
  // Visit with ?debug=1 in the URL to see this panel. Regular visitors
  // never see it — otherwise it's just a quiet console.warn().
  const isDebug = new URLSearchParams(window.location.search).get('debug') === '1';
  const debugPanel = document.getElementById('debugPanel');
  const debugList = document.getElementById('debugList');
  const skippedLog = [];
  if(isDebug) debugPanel.classList.add('show');

  function logSkippedSong(title, videoId, reason){
    const entry = { title, videoId, reason, time: new Date().toLocaleTimeString() };
    skippedLog.unshift(entry);
    console.warn('[After Hours] Skipped song:', entry);
    if(isDebug){
      debugList.innerHTML = skippedLog.slice(0, 20).map(e =>
        `<div><strong>${e.time}</strong> — ${e.reason}<br>${e.title || e.videoId}</div>`
      ).join('') || 'none yet';
    }
  }

  // ---------- YouTube playlist player ----------
  const YT_PLAYLIST_ID = "PL7B34S0Z1qGxE8spoH0xitKG-3jLI5CyZ";

  if(YT_PLAYLIST_ID){
    youtubeLink.href = "https://www.youtube.com/playlist?list=" + YT_PLAYLIST_ID;
    youtubeLink.style.display = 'flex';
  }

  let ytPlayer, ytReady = false, isPlaying = false, progressTimer;
  let userWantsToPlay = false;
  let consecutiveErrors = 0;
  const MAX_CONSECUTIVE_ERRORS = 6;
  let songVolumeValue = 100;
  let rainVolumeValue = 35;
  let isSeeking = false;

  const playBtn = document.getElementById('playBtn');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const seekBar = document.getElementById('seekBar');
  const timeText = document.getElementById('timeText');
  const songVolume = document.getElementById('songVolume');
  const rainVolume = document.getElementById('rainVolume');
  const thumb = document.getElementById('thumb');

  function fmt(s){
    s = Math.floor(s || 0);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  let inMixFallback = false;
  let pinnedSeedId = null;
  const playedVideoIds = new Set();
  const PINNED_SEED_VIDEO_ID = "";

  function onYouTubeIframeAPIReady(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1',
      playerVars: { listType: 'playlist', list: YT_PLAYLIST_ID, autoplay: 0, playsinline: 1, rel: 0, origin: window.location.origin },
      events: {
        onReady: () => {
          ytReady = true;
          ytPlayer.setShuffle(true);
          ytPlayer.setVolume(songVolumeValue);

          const originalList = ytPlayer.getPlaylist() || [];
          pinnedSeedId = PINNED_SEED_VIDEO_ID || originalList[0] || null;

          // Fix: the cued video is always index 0 regardless of shuffle —
          // shuffle only reorders what comes AFTER the first track. So we
          // jump to a random track now (muted, then paused) so the very
          // first play is random too, not always the same song.
          if(originalList.length > 1){
            const randomIndex = Math.floor(Math.random() * originalList.length);
            ytPlayer.mute();
            ytPlayer.playVideoAt(randomIndex);
            setTimeout(() => {
              ytPlayer.pauseVideo();
              ytPlayer.unMute();
            }, 350);
          }
        },
        onError: (e) => {
          const reasons = {
            2: 'invalid video',
            5: 'playback not supported',
            100: 'unavailable/removed',
            101: 'blocked from embedding',
            150: 'blocked from embedding'
          };
          const reason = reasons[e.data] || 'unknown error';
          let curTitle = '', curId = '';
          try {
            const d = ytPlayer.getVideoData();
            curTitle = d.title; curId = d.video_id;
          } catch(err){}
          logSkippedSong(curTitle, curId, reason);

          consecutiveErrors++;
          if(consecutiveErrors >= MAX_CONSECUTIVE_ERRORS){
            trackTitle.textContent = 'Playback trouble right now';
            trackArtist.textContent = 'Try opening the playlist on YouTube ↗';
            playBtn.textContent = '▶';
            isPlaying = false;
            thumb.classList.remove('spinning');
            return;
          }

          // Auto-skip quietly — no on-screen message, keeps the mood intact.
          setTimeout(() => {
            if(!ytReady) return;
            ytPlayer.nextVideo();
            if(userWantsToPlay){
              setTimeout(() => ytPlayer.playVideo(), 200);
            }
          }, 400);
        },
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.PLAYING){
            consecutiveErrors = 0;
            isPlaying = true;
            playBtn.textContent = '❚❚';
            thumb.classList.add('spinning');
            const data = ytPlayer.getVideoData();
            playedVideoIds.add(data.video_id);
            trackTitle.textContent = data.title || 'now playing';
            trackArtist.textContent = (data.author || 'after hours') + (inMixFallback ? ' · mix' : '');
            clearInterval(progressTimer);
            progressTimer = setInterval(updateProgress, 500);
          } else if(e.data === YT.PlayerState.PAUSED){
            isPlaying = false;
            playBtn.textContent = '▶';
            thumb.classList.remove('spinning');
            clearInterval(progressTimer);
          }
        }
      }
    });
  }

  function updateProgress(){
    if(!ytReady) return;
    const dur = ytPlayer.getDuration();
    const cur = ytPlayer.getCurrentTime();
    if(dur > 0 && !isSeeking){
      const pct = Math.max(0, Math.min(100, (cur / dur) * 100));
      seekBar.value = Math.round(pct * 10);
      seekBar.style.setProperty('--seek', pct + '%');
      timeText.textContent = fmt(cur) + ' / ' + fmt(dur);
    }
  }

  function seekToPercent(value){
    if(!ytReady) return;
    const dur = ytPlayer.getDuration();
    if(dur > 0){
      ytPlayer.seekTo((Number(value) / 1000) * dur, true);
    }
  }

  function skipSeconds(seconds){
    if(!ytReady) return;
    const dur = ytPlayer.getDuration();
    const cur = ytPlayer.getCurrentTime();
    if(dur > 0){
      ytPlayer.seekTo(Math.max(0, Math.min(dur, cur + seconds)), true);
    }
  }

  seekBar.addEventListener('input', () => {
    isSeeking = true;
    const dur = ytReady ? ytPlayer.getDuration() : 0;
    if(dur > 0){
      const target = (Number(seekBar.value) / 1000) * dur;
      seekBar.style.setProperty('--seek', (Number(seekBar.value) / 10) + '%');
      timeText.textContent = fmt(target) + ' / ' + fmt(dur);
    }
  });
  seekBar.addEventListener('change', () => {
    seekToPercent(seekBar.value);
    isSeeking = false;
  });

  document.getElementById('back10Btn').addEventListener('click', () => skipSeconds(-10));
  document.getElementById('forward10Btn').addEventListener('click', () => skipSeconds(10));

  // Keyboard shortcuts: ←/→ seek 10 seconds when the player is focused.
  document.addEventListener('keydown', (e) => {
    if(e.target.matches('input, textarea, select')) return;
    if(e.key === 'ArrowLeft') { e.preventDefault(); skipSeconds(-10); }
    if(e.key === 'ArrowRight') { e.preventDefault(); skipSeconds(10); }
  });

  playBtn.addEventListener('click', () => {
    if(!ytReady) return;
    if(isPlaying){
      userWantsToPlay = false;
      ytPlayer.pauseVideo();
    } else {
      userWantsToPlay = true;
      ytPlayer.playVideo();
    }
  });
  document.getElementById('nextBtn').addEventListener('click', () => { if(ytReady) ytPlayer.nextVideo(); });
  document.getElementById('prevBtn').addEventListener('click', () => { if(ytReady) ytPlayer.previousVideo(); });

  // ---------- volume mixer ----------
  songVolume.addEventListener('input', () => {
    songVolumeValue = Number(songVolume.value);
    if(ytReady) ytPlayer.setVolume(songVolumeValue);
  });

  // ---------- rain ambience (real recording, loops until toggled off) ----------
  const rainAudio = document.getElementById('rainAudio');
  const rainToggle = document.getElementById('rainToggle');
  const rainLabel = document.getElementById('rainLabel');
  rainAudio.volume = 0;
  let rainActive = false;
  rainVolumeValue = Number(rainVolume.value) / 100;

  // HTMLMediaElement loop can introduce a tiny audible gap in some browsers.
  // Restart immediately on ended as a fallback to minimize that gap.
  rainAudio.loop = false;
  rainAudio.addEventListener('ended', () => {
    if(!rainActive) return;
    rainAudio.currentTime = 0;
    const p = rainAudio.play();
    if(p) p.catch(()=>{});
  });
  let rainFadeTimer = null;

  function fadeRain(target, ms){
    clearInterval(rainFadeTimer);
    const start = rainAudio.volume;
    const startTime = performance.now();
    rainFadeTimer = setInterval(() => {
      const t = Math.min(1, (performance.now() - startTime) / ms);
      rainAudio.volume = start + (target - start) * t;
      if(t >= 1) clearInterval(rainFadeTimer);
    }, 40);
  }

  rainVolume.addEventListener('input', () => {
    rainVolumeValue = Number(rainVolume.value) / 100;
    if(rainActive) rainAudio.volume = rainVolumeValue;
  });

  rainToggle.addEventListener('click', () => {
    rainActive = !rainActive;
    rainToggle.classList.toggle('active', rainActive);
    rainLabel.textContent = rainActive ? 'rain: on' : 'rain: off';

    if(rainActive){
      rainAudio.currentTime = 0;
      rainAudio.play().catch(() => {
        setTimeout(() => rainAudio.play().catch(()=>{}), 150);
      });
      fadeRain(rainVolumeValue, 500);
    } else {
      fadeRain(0, 900);
      setTimeout(() => { if(!rainActive) rainAudio.pause(); }, 950);
    }
  });
</script>

</body>
</html>
